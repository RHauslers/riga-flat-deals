name: Hourly hot-deal scan

on:
  schedule:
    # Every hour at :05 (offset to avoid the GitHub Actions cron rush at :00)
    - cron: "5 * * * *"
  workflow_dispatch: {}  # allow manual runs

permissions:
  contents: write  # needed to commit history.csv + alerted_deals.json back

concurrency:
  # Shared with daily.yml: both jobs commit state to the same branch. A shared
  # group makes the second run queue instead of colliding on `git push`.
  group: flat-searcher-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git pull --rebase` works on push retry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser (chromium)
        run: |
          python -m playwright install --with-deps chromium

      - name: Run hourly escalation scan
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          OPS_EMAIL_TO: ${{ secrets.OPS_EMAIL_TO }}
          UNSUBSCRIBE_URL: ${{ secrets.UNSUBSCRIBE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          python -X utf8 -m escalation

      - name: Commit persisted state (rebase-safe)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv data/alerted_deals.json 2>/dev/null || true
          # only commit docs/ if the escalation updated the website (hot deal found)
          git add docs/index.html docs/archive.html docs/archive/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi

          git commit -m "chore(data): hourly escalation scan $(date -u +%Y-%m-%d_%H:%M)"

          # Pull-rebase-retry loop. See daily.yml for rationale.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME"; then
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "push succeeded on attempt $attempt"
                exit 0
              fi
            fi
            echo "push attempt $attempt failed, retrying in ${attempt}0s..."
            sleep "${attempt}0"
          done

          echo "::error::Failed to push state after 5 attempts (branch=$GITHUB_REF_NAME)"
          exit 1
