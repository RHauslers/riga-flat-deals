name: Daily flat deals

# ONE scheduled run per day. This is the only scheduled job in the repo:
# both the flat digest and the car digest are produced by `python -m main`
# in this run, and the site is website-only (no email, no hourly scans).
on:
  schedule:
    # 03:17 UTC = 05:17/06:17 Riga (winter/summer). GitHub cron is best-effort
    # and this repo's previous 06:23 UTC slot started 4.6-11.4 h late every
    # day (site updated ~15:00 Riga). An early, non-round minute leaves the
    # most headroom so the page is fresh by the time anyone looks at it.
    - cron: "17 3 * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

permissions:
  contents: write  # needed to commit data/ + docs/ back
  pages: write     # needed to deploy the hosted site
  id-token: write  # needed for Pages deploy authentication

concurrency:
  # A manual run overlapping the scheduled one would race on the state
  # commit; queue instead of collide.
  group: flat-searcher-state
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Flats take ~3-5 min; the model-blind car scan adds ~10-15 min
    # (≈500 ss.com requests at ≥1 s + pp.lv at 5 s crawl-delay).
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git pull --rebase` works on push retry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser (chromium)
        run: |
          python -m playwright install --with-deps chromium

      - name: Run daily scrape + score + build digests
        run: |
          python -X utf8 -m main

      - name: Commit persisted state (rebase-safe)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage ALL changes (gitignore excludes junk); this also records the
          # deletions made by the archive pruning in website.build().
          git add -A

          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi

          git commit -m "chore(data): daily scrape update $(date -u +%Y-%m-%d)"

          # Pull-rebase-retry loop: a manual run or re-triggered schedule can
          # still race with an in-flight push. Retry up to 5 times instead of
          # silently dropping our state update.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME"; then
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "push succeeded on attempt $attempt"
                exit 0
              fi
            fi
            echo "push attempt $attempt failed, retrying in ${attempt}0s..."
            sleep "${attempt}0"
          done

          echo "::error::Failed to push state after 5 attempts (branch=$GITHUB_REF_NAME)"
          exit 1

  # Deploy the updated docs/ to GitHub Pages. This runs AFTER the scrape job
  # commits the new pages, so the site always reflects the latest digest.
  # We can't rely on pages.yml's push trigger because pushes made by
  # github-actions[bot] via GITHUB_TOKEN don't trigger other workflows
  # (GitHub prevents this to avoid infinite loops).
  deploy-pages:
    needs: scrape
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout (latest, including the scrape job's commit)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
