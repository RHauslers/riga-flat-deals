name: Daily flat deals

on:
  schedule:
    # 07:00 UTC = 10:00 Riga (EEST, UTC+3). Latvia observes EET/EEST.
    - cron: "0 7 * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

permissions:
  contents: write  # needed to commit history.csv / seen_ids.json back

concurrency:
  # Shared with escalation.yml on purpose: both jobs commit state (history.csv,
  # seen_deals.json, alerted_deals.json) to the same branch. Running them
  # concurrently caused push races where one run's state update was discarded.
  # A shared group makes the second run queue instead of collide.
  group: flat-searcher-state
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git pull --rebase` works on push retry

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browser (chromium)
        run: |
          python -m playwright install --with-deps chromium

      - name: Run daily scrape + score + email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          OPS_EMAIL_TO: ${{ secrets.OPS_EMAIL_TO }}
          UNSUBSCRIBE_URL: ${{ secrets.UNSUBSCRIBE_URL }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          python -X utf8 -m main

      - name: Commit persisted state (rebase-safe)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage ALL changes (gitignore excludes junk). Using specific file
          # lists left some modified files unstaged, which made
          # `git pull --rebase` fail with "unstaged changes".
          git add -A

          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi

          git commit -m "chore(data): daily scrape update $(date -u +%Y-%m-%d)"

          # Pull-rebase-retry loop. The escalation workflow shares the
          # `flat-searcher-state` concurrency group, so collisions should be
          # rare, but a manual run or a re-triggered schedule can still race
          # with an in-flight push from another branch ref. Retry up to 5
          # times instead of silently dropping our state update.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME"; then
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                echo "push succeeded on attempt $attempt"
                exit 0
              fi
            fi
            echo "push attempt $attempt failed, retrying in ${attempt}0s..."
            sleep "${attempt}0"
          done

          echo "::error::Failed to push state after 5 attempts (branch=$GITHUB_REF_NAME)"
          exit 1
