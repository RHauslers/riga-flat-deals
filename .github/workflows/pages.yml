name: Deploy unsubscribe page

on:
  push:
    branches: [main, master]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject tokens into pages
        env:
          UNSUBSCRIBE_TOKEN: ${{ secrets.UNSUBSCRIBE_PAT }}
          TRIGGER_TOKEN: ${{ secrets.TRIGGER_PAT }}
          REPO: ${{ github.repository }}
        run: |
          OWNER=$(echo "$REPO" | cut -d/ -f1)
          NAME=$(echo "$REPO" | cut -d/ -f2)
          if [ -z "$UNSUBSCRIBE_TOKEN" ] || [ "$UNSUBSCRIBE_TOKEN" = "" ]; then
            echo "::warning::UNSUBSCRIBE_PAT secret is not set - page will deploy but unsubscribe button will not work"
          fi
          sed -i "s|__UNSUBSCRIBE_TOKEN__|${UNSUBSCRIBE_TOKEN}|g" docs/unsubscribe.html
          sed -i "s|__REPO_OWNER__|${OWNER}|g" docs/unsubscribe.html
          sed -i "s|__REPO_NAME__|${NAME}|g" docs/unsubscribe.html
          # Rescrape button token: TRIGGER_PAT if set, else UNSUBSCRIBE_PAT
          TT="${TRIGGER_TOKEN:-$UNSUBSCRIBE_TOKEN}"
          for f in docs/index.html docs/archive/*.html; do
            [ -f "$f" ] || continue
            sed -i "s|__TRIGGER_TOKEN__|${TT}|g" "$f"
            sed -i "s|__REPO_OWNER__|${OWNER}|g" "$f"
            sed -i "s|__REPO_NAME__|${NAME}|g" "$f"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
