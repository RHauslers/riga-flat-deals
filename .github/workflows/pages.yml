name: Deploy site

# Redeploys docs/ to GitHub Pages when a human pushes site changes (the
# scheduled daily job deploys its own output, see daily.yml). No secrets are
# read and nothing is injected into the pages: docs/ is served verbatim.
on:
  push:
    branches: [main, master]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
